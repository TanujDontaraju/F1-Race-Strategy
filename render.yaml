# Render blueprint for the telemetry API: render.com/docs/blueprint-spec
# New → Blueprint on Render, point it at this repo, and it reads this file.
services:
  - type: web
    name: f1-telemetry-api
    plan: free
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Fill this in with your Vercel URL once you have it (Render dashboard → Environment).
      - key: ALLOWED_ORIGINS
        sync: false
