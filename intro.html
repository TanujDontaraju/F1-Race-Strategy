<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Intro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            font-family: 'Formula1-Display-Regular', sans-serif;
            /* For 3D depth perception of flashes */
            perspective: 800px;
        }

        /* --- Main Animation Containers --- */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }


        /* --- Background Flashes --- */
        .flashes-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .flash {
            position: absolute;
            height: 3px;
            width: 300px;
            background: linear-gradient(to right, rgba(220, 0, 0, 0), rgba(255, 20, 20, 0.8), rgba(220, 0, 0, 0));
            border-radius: 5px;
            filter: blur(2px);
            animation: moveFlash 2s linear infinite;
            opacity: 0;
        }

        @keyframes moveFlash {
            0% {
                transform: translateX(-350px) skewX(-30deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateX(100vw) skewX(-30deg);
                opacity: 0;
            }
        }

        /* Vary position, duration, and delay for depth */
        .flash.f1 { top: 15%; animation-duration: 1.3s; animation-delay: 0s; }
        .flash.f2 { top: 30%; animation-duration: 1.6s; animation-delay: 0.2s; }
        .flash.f3 { top: 45%; animation-duration: 1.1s; animation-delay: 0.5s; }
        .flash.f4 { top: 60%; animation-duration: 1.8s; animation-delay: 0.8s; }
        .flash.f5 { top: 75%; animation-duration: 1.4s; animation-delay: 1.2s; }
        .flash.f6 { top: 85%; animation-duration: 1.5s; animation-delay: 1.5s; }
        .flash.f7 { top: 5%; animation-duration: 1.2s; animation-delay: 0.1s; }
        .flash.f8 { top: 22%; animation-duration: 1.5s; animation-delay: 0.7s; }
        .flash.f9 { top: 38%; animation-duration: 1.2s; animation-delay: 1.3s; }
        .flash.f10 { top: 55%; animation-duration: 1.7s; animation-delay: 1.7s; }
        .flash.f11 { top: 68%; animation-duration: 1.5s; animation-delay: 2.0s; }
        .flash.f12 { top: 95%; animation-duration: 1.3s; animation-delay: 2.2s; }

        /* --- Lights --- */
        .lights-container {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
            animation: fadeOutLights 1s ease-in-out 5s forwards;
        }

        .light {
            width: 50px;
            height: 50px;
            background-color: #330000;
            border-radius: 50%;
            border: 2px solid #444;
            opacity: 0;
        }

        .light.on {
            background-color: #ff0000;
            box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
        }

        #light-1 { animation: turnOn 1s forwards 0.5s; }
        #light-2 { animation: turnOn 1s forwards 1.5s; }
        #light-3 { animation: turnOn 1s forwards 2.5s; }
        #light-4 { animation: turnOn 1s forwards 3.5s; }
        #light-5 { animation: turnOn 1s forwards 4.5s; }

        @keyframes turnOn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOutLights {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.8); }
        }

        /* --- F1 Logo --- */
        .f1-logo-container {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: fadeInLogo 1s ease-in-out 6s forwards;
        }

        .f1-logo {
            width: 500px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
        }

        @keyframes fadeInLogo {
            from { opacity: 0; transform: scale(0.6); }
            to   { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>
    <div class="flashes-container">
        <div class="flash f1"></div>
        <div class="flash f2"></div>
        <div class="flash f3"></div>
        <div class="flash f4"></div>
        <div class="flash f5"></div>
        <div class="flash f6"></div>
        <div class="flash f7"></div>
        <div class="flash f8"></div>
        <div class="flash f9"></div>
        <div class="flash f10"></div>
        <div class="flash f11"></div>
        <div class="flash f12"></div>
    </div>

    <div class="container">
        <!-- Lights Out -->
        <div class="lights-container">
            <div class="light" id="light-1"></div>
            <div class="light" id="light-2"></div>
            <div class="light" id="light-3"></div>
            <div class="light" id="light-4"></div>
            <div class="light" id="light-5"></div>
        </div>

        <!-- F1 Logo -->
        <div class="f1-logo-container">
            <img src="{{LOGO_SRC}}" alt="F1 Logo" class="f1-logo">
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="lights-sound" src="{{LIGHTS_SOUND_SRC}}" preload="auto"></audio>
    <audio id="engine-sound" src="{{ENGINE_SRC}}" preload="auto"></audio>

    <script>
        const lightsSound = document.getElementById('lights-sound');
        const engineSound = document.getElementById('engine-sound');

        // Function to play sound, handling potential browser restrictions
        function playSound(soundElement) {
            // Only try to play the sound if the src attribute is set and not empty
            if (soundElement && soundElement.getAttribute('src')) {
                soundElement.currentTime = 0;
                soundElement.play().catch(error => {
                    // Autoplay is often blocked by browsers until user interaction.
                    console.log("Audio playback failed (this is expected on browsers with strict autoplay policies):", error);
                });
            }
        }

        // Timings for the visual lights turning on, to sync with the audio file.
        // This assumes a 1-second interval between beeps in the audio.
        const lightVisualTimings = [500, 1500, 2500, 3500, 4500];

        // Play the multi-beep starting lights sound once, synced with the first light.
        setTimeout(() => {
            playSound(lightsSound);
        }, lightVisualTimings[0]);

        // Animate the lights turning on visually.
        lightVisualTimings.forEach((time, index) => {
            setTimeout(() => {
                document.getElementById(`light-${index + 1}`).classList.add('on');
            }, time);
        });

        // Trigger the engine sound after the lights go out (animation starts at 5s)
        setTimeout(() => {
            engineSound.volume = 0.7;
            playSound(engineSound);

            // Start fading out the engine sound after 3 seconds for a total duration of ~4 seconds
            setTimeout(() => {
                let fadeAudio = setInterval(() => {
                    // Reduce volume gradually
                    if (engineSound.volume > 0.05) {
                        engineSound.volume -= 0.05;
                    } else {
                        // Once volume is low, stop the sound and clear the interval
                        clearInterval(fadeAudio);
                        engineSound.pause();
                        engineSound.currentTime = 0;
                        engineSound.volume = 0.7; // Reset volume for any potential replay
                    }
                }, 100); // This interval controls the fade speed
            }, 3000);

        }, 5000);
    </script>
</body>
</html>
