<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Intro</title>
    <style>{{CSS_STYLES}}</style>
</head>
<body>
    <div class="flashes-container">
        <div class="flash f1"></div>
        <div class="flash f2"></div>
        <div class="flash f3"></div>
        <div class="flash f4"></div>
        <div class="flash f5"></div>
        <div class="flash f6"></div>
        <div class="flash f7"></div>
        <div class="flash f8"></div>
        <div class="flash f9"></div>
        <div class="flash f10"></div>
        <div class="flash f11"></div>
        <div class="flash f12"></div>
        <div class="flash f13"></div>
        <div class="flash f14"></div>
        <div class="flash f15"></div>
        <div class="flash f16"></div>
        <div class="flash f17"></div>
        <div class="flash f18"></div>
        <div class="flash f19"></div>
        <div class="flash f20"></div>
    </div>

    <div class="container">
        <!-- Lights Out -->
        <div class="lights-container">
            <div class="light" id="light-1"></div>
            <div class="light" id="light-2"></div>
            <div class="light" id="light-3"></div>
            <div class="light" id="light-4"></div>
            <div class="light" id="light-5"></div>
        </div>

        <!-- F1 Logo -->
        <div class="f1-logo-container">
            <img src="{{LOGO_SRC}}" alt="F1 Logo" class="f1-logo">
        </div>
    </div>

    <script>
        // Timings for the visual lights turning on, to sync with the audio file.
        // This assumes a 1-second interval between beeps in the audio.
        const lightVisualTimings = [500, 1500, 2500, 3500, 4500];

        // Animate the lights turning on visually.
        lightVisualTimings.forEach((time, index) => {
            setTimeout(() => {
                document.getElementById(`light-${index + 1}`).classList.add('on');
            }, time);
        });
        
        // The lights-container fadeOutLights animation starts at 5s.
        // We'll use this timing to know when the intro sequence is visually complete.
        setTimeout(() => {
            // No audio to play, but this is where other post-lights-out actions could go.
            // For now, it just marks the end of the visual lights sequence.
        }, 5000);
    </script>
</body>
</html>
