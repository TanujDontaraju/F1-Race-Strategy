<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Intro</title>
    <style>{{CSS_STYLES}}</style>
</head>
<body>
    <div class="flashes-container">
        <div class="flash f1"></div>
        <div class="flash f2"></div>
        <div class="flash f3"></div>
        <div class="flash f4"></div>
        <div class="flash f5"></div>
        <div class="flash f6"></div>
        <div class="flash f7"></div>
        <div class="flash f8"></div>
        <div class="flash f9"></div>
        <div class="flash f10"></div>
        <div class="flash f11"></div>
        <div class="flash f12"></div>
        <div class="flash f13"></div>
        <div class="flash f14"></div>
        <div class="flash f15"></div>
        <div class="flash f16"></div>
        <div class="flash f17"></div>
        <div class="flash f18"></div>
        <div class="flash f19"></div>
        <div class="flash f20"></div>
    </div>

    <div class="container">
        <!-- Lights Out -->
        <div class="lights-container">
            <div class="light" id="light-1"></div>
            <div class="light" id="light-2"></div>
            <div class="light" id="light-3"></div>
            <div class="light" id="light-4"></div>
            <div class="light" id="light-5"></div>
        </div>

        <!-- F1 Logo -->
        <div class="f1-logo-container">
            <img src="{{LOGO_SRC}}" alt="F1 Logo" class="f1-logo">
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="lights-sound" src="{{LIGHTS_SOUND_SRC}}" preload="auto"></audio>
    <audio id="engine-sound" src="{{ENGINE_SRC}}" preload="auto"></audio>

    <script>
        const lightsSound = document.getElementById('lights-sound');
        const engineSound = document.getElementById('engine-sound');

        // Function to play sound, handling potential browser restrictions
        function playSound(soundElement) {
            // Only try to play the sound if the src attribute is set and not empty
            if (soundElement && soundElement.getAttribute('src')) {
                soundElement.currentTime = 0;
                soundElement.play().catch(error => {
                    // Autoplay is often blocked by browsers until user interaction.
                    console.log("Audio playback failed (this is expected on browsers with strict autoplay policies):", error);
                });
            }
        }

        // Timings for the visual lights turning on, to sync with the audio file.
        // This assumes a 1-second interval between beeps in the audio.
        const lightVisualTimings = [500, 1500, 2500, 3500, 4500];

        // Play the multi-beep starting lights sound once, synced with the first light.
        setTimeout(() => {
            playSound(lightsSound);
        }, lightVisualTimings[0]);

        // Animate the lights turning on visually.
        lightVisualTimings.forEach((time, index) => {
            setTimeout(() => {
                document.getElementById(`light-${index + 1}`).classList.add('on');
            }, time);
        });

        // Trigger the engine sound after the lights go out (animation starts at 5s)
        setTimeout(() => {
            engineSound.volume = 0.7;
            playSound(engineSound);

            // Start fading out the engine sound after 3 seconds for a total duration of ~4 seconds
            setTimeout(() => {
                let fadeAudio = setInterval(() => {
                    // Reduce volume gradually
                    if (engineSound.volume > 0.05) {
                        engineSound.volume -= 0.05;
                    } else {
                        // Once volume is low, stop the sound and clear the interval
                        clearInterval(fadeAudio);
                        engineSound.pause();
                        engineSound.currentTime = 0;
                        engineSound.volume = 0.7; // Reset volume for any potential replay
                    }
                }, 100); // This interval controls the fade speed
            }, 3000);

        }, 5000);
    </script>
</body>
</html>
